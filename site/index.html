<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BookReader</title>
  <meta name="description" content="A personal PDF library: search, browse and read PDFs in the browser." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b5482a'/%3E%3Cpath d='M9 8h9a5 5 0 0 1 5 5v11H14a5 5 0 0 1-5-5z' fill='%23fff'/%3E%3Cpath d='M13 13h6M13 17h6' stroke='%23b5482a' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const t = JSON.parse(localStorage.getItem("bookreader.theme"));
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <button id="menu" class="icon-btn menu-btn" type="button" aria-label="Show categories" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="brand" href="#/" aria-label="Library home">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M9 8h9a5 5 0 0 1 5 5v11H14a5 5 0 0 1-5-5z" fill="#fff"/><path d="M13 13h6M13 17h6" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span id="brand-title">BookReader</span>
      </a>
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search titles, authors, tags and text" autocomplete="off" spellcheck="false" aria-label="Search the library" />
        <kbd aria-hidden="true">/</kbd>
      </div>
      <div class="topbar-actions">
        <a id="repo" class="icon-btn" target="_blank" rel="noopener" hidden aria-label="Open the GitHub repository" title="GitHub repository">
          <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <button id="theme" class="icon-btn" type="button" aria-label="Theme: system"></button>
      </div>
    </div>
  </header>

  <div class="layout" id="layout" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Categories">
      <nav class="side-nav">
        <a class="side-link" data-nav="home" href="#/">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>All documents</span><span class="count" id="count-all"></span>
        </a>
        <a class="side-link" data-nav="recent" href="#/recent">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Recently read</span><span class="count" id="count-recent"></span>
        </a>
        <a class="side-link" data-nav="favorites" href="#/favorites">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.3 2.8 1-5.9-4.2-4.1 5.9-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>Favorites</span><span class="count" id="count-fav"></span>
        </a>
      </nav>
      <h2 class="side-heading">Categories</h2>
      <ul id="tree" class="tree" role="tree" aria-label="Category tree"></ul>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <main id="library" class="content">
      <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
      <header class="page-head">
        <h1 id="page-title"></h1>
        <p id="page-desc" class="page-desc"></p>
      </header>

      <section id="continue" class="shelf" hidden aria-labelledby="continue-title">
        <div class="section-head"><h2 id="continue-title">Continue reading</h2><a class="section-link" href="#/recent">See all</a></div>
        <div id="continue-row" class="shelf-row"></div>
      </section>

      <section id="subfolders" hidden aria-labelledby="subfolders-title">
        <div class="section-head"><h2 id="subfolders-title">Categories</h2></div>
        <div id="folder-grid" class="folder-grid"></div>
      </section>

      <section id="results" aria-labelledby="results-title">
        <div class="section-head results-head">
          <h2 id="results-title">Documents</h2>
          <span id="results-note" class="muted"></span>
          <div class="toolbar">
            <label class="check" id="nested-wrap" hidden><input type="checkbox" id="nested" /> Include sub-categories</label>
            <label class="sort"><span class="sr-only">Sort by</span><select id="sort"></select></label>
            <div class="seg" role="group" aria-label="Layout">
              <button type="button" data-layout="grid" aria-label="Grid view" title="Grid view">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="currentColor"/></svg>
              </button>
              <button type="button" data-layout="list" aria-label="List view" title="List view">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div id="tags" class="tags" aria-label="Filter by tag"></div>
        <div id="docs" class="grid"></div>
        <div id="more" class="more-row" hidden><button id="more-btn" type="button" class="btn">Show more</button></div>
      </section>

      <section id="text-results" hidden aria-labelledby="text-title">
        <div class="section-head">
          <h2 id="text-title">Found inside documents</h2>
          <span id="text-note" class="muted"></span>
        </div>
        <ol id="text-hits" class="hits"></ol>
        <div id="text-more" class="more-row" hidden><button id="text-more-btn" type="button" class="btn">Show more documents</button></div>
      </section>

      <div id="empty" class="empty" hidden></div>
    </main>
  </div>

  <section id="reader" class="reader" hidden aria-label="Reader">
    <div class="reader-bar">
      <button id="back" class="icon-btn" type="button" aria-label="Back to library" title="Back to library (Esc)">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="reader-title">
        <strong id="r-title"></strong>
        <span id="r-sub" class="muted"></span>
      </div>
      <span id="r-page" class="r-page muted" aria-live="polite"></span>
      <button id="r-info" class="icon-btn" type="button" aria-pressed="false" aria-controls="info" aria-label="Document details" title="Details (i)">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button id="r-fav" class="icon-btn star" type="button" aria-pressed="false" aria-label="Add to favorites" title="Favorite">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.3 2.8 1-5.9-4.2-4.1 5.9-.8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button id="r-copy" class="icon-btn hide-sm" type="button" aria-label="Copy link to this page" title="Copy link to this page">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a id="r-download" class="icon-btn hide-sm" download aria-label="Download PDF" title="Download PDF">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
    <div class="reader-body">
      <iframe id="viewer" title="PDF viewer" allow="fullscreen; clipboard-write"></iframe>
      <aside id="info" class="info-panel" hidden aria-label="Document details"></aside>
    </div>
  </section>

  <footer id="footer" class="footer"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>

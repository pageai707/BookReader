name: Build and deploy library

on:
  push:
    branches: [main]
    paths:
      - "library/**"
      - "site/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for each PDF's "added" date
          lfs: true # in case large PDFs are stored with Git LFS

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Reuse text/thumbnail extraction for PDFs that haven't changed, plus the downloaded PDF.js viewer.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: build-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: build-cache-${{ hashFiles('package-lock.json') }}-

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
